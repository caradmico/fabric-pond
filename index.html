<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fabric pond — math scenarios</title>
  <style>
    html, body { margin: 0; height: 100%; background: #07080c; color: #e8e6df; font-family: ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
    #c { display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute; left: 14px; top: 14px; width: min(440px, calc(100vw - 320px));
      background: rgba(8,10,16,.78); border: 1px solid #2a3144; border-radius: 12px;
      padding: 12px 14px; font-size: 13px; line-height: 1.45; backdrop-filter: blur(8px);
    }
    #hud h1 { font-size: 14px; margin: 0 0 6px; font-weight: 600; }
    #hud p { margin: 0 0 8px; color: #b7b3a8; }
    #math { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #d4c48a; margin: 0 0 8px; white-space: pre-wrap; }
    #plain {
      background: rgba(90, 140, 90, .12); border: 1px solid #3d5a3d; border-radius: 8px;
      padding: 8px 10px; color: #cfe6cf; margin: 0 0 8px; font-size: 13px;
    }
    #plain strong { color: #e8f5e8; }
    #status { color: #9fd6ff; font-variant-numeric: tabular-nums; min-height: 1.3em; }
    #pops { position: absolute; inset: 0; pointer-events: none; z-index: 6; overflow: hidden; }
    .pop {
      position: absolute; max-width: 230px; transform: translate(-50%, -110%);
      background: #f4efe4; color: #1a1c22; border-radius: 12px; padding: 8px 10px;
      font-size: 12px; line-height: 1.35; box-shadow: 0 8px 24px rgba(0,0,0,.4);
      animation: popin .18s ease-out;
    }
    .pop:after {
      content: ''; position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%);
      border: 7px solid transparent; border-top-color: #f4efe4;
    }
    .pop.alice { background: #ffd5c8; }
    .pop.bob { background: #cfe4ff; }
    .pop.warn { background: #ffe08a; }
    @keyframes popin { from { opacity: 0; transform: translate(-50%, -90%); } to { opacity: 1; transform: translate(-50%, -110%); } }
    #panel {
      position: absolute; right: 14px; top: 14px; width: 270px;
      background: rgba(8,10,16,.84); border: 1px solid #2a3144; border-radius: 12px;
      padding: 12px; font-size: 12px; backdrop-filter: blur(8px);
      max-height: calc(100vh - 28px); overflow: auto;
    }
    select, button, input[type=range] { width: 100%; box-sizing: border-box; }
    select {
      background: #1b2233; color: #e8e6df; border: 1px solid #3a4560; border-radius: 8px;
      padding: 8px; margin-bottom: 10px;
    }
    label { display: flex; justify-content: space-between; gap: 8px; margin: 8px 0 2px; color: #c9c4b8; }
    .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .row button { width: auto; flex: 1; }
    button {
      background: #1b2233; color: #e8e6df; border: 1px solid #3a4560; border-radius: 8px;
      padding: 7px 10px; cursor: pointer; font-size: 12px;
    }
    button:hover { background: #243049; }
    button.primary { background: #2a4a6e; border-color: #5aa0d6; }
    .tog { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: #c9c4b8; }
    .tog input { width: auto; }
    #hud, #panel, #hint { z-index: 5; }
    #hint {
      position: absolute; bottom: 12px; left: 14px; font-size: 11px; color: #c9c4b8;
      background: rgba(8,10,16,.82); border: 1px solid #2a3144; border-radius: 8px;
      padding: 6px 10px;
    }
    .rng { display: flex; justify-content: space-between; color: #6f6b63; font-size: 10px; margin-top: -2px; }
    .hidden { display: none !important; }
    .break {
      margin-top: 14px; padding-top: 10px; border-top: 1px solid #5a3030;
    }
    .break h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #e8a090; margin: 0 0 6px; font-weight: 650; }
    #breakBody { margin-top: 6px; }
    .pop.oops { background: #ff8a7a; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <h1 id="title">Scenario</h1>
    <p id="blurb"></p>
    <div id="math"></div>
    <div id="plain"></div>
    <div id="status"></div>
  </div>
  <div id="pops"></div>
  <div id="panel">
    <select id="sceneSel">
      <option value="light">1. Light-tick (baseline, K=1)</option>
      <option value="zoom">2. Far-field point (stars)</option>
      <option value="glue">3. Through the wall vs around it</option>
      <option value="mode">4. Shared-mode coupler (no ∇)</option>
      <option value="mirage">5. Coarse-clock mirage</option>
      <option value="break">6. Break physics (v > c)</option>
    </select>
    <div id="ctrls"></div>
    <div class="break">
      <h2>Break physics</h2>
      <div class="tog"><input type="checkbox" id="breakOn" /> <span>unlock illegal knobs</span></div>
      <div id="breakBody" class="hidden">
        <label><span>signal speed v/c</span><span id="vcVal">1.0</span></label>
        <input id="vc" type="range" min="0.2" max="3" step="0.05" value="1" />
        <div class="rng"><span>slow</span><span>light</span><span>faster than light</span></div>
        <div class="tog"><input type="checkbox" id="hissBit" /> <span>hiss counts as a word</span></div>
        <div class="tog"><input type="checkbox" id="noLoc" /> <span>no locality (remote address)</span></div>
        <div class="tog"><input type="checkbox" id="bothWay" /> <span>both-way coupler</span></div>
      </div>
    </div>
  </div>
  <div id="hint">drag to orbit · scroll to zoom · math is the engine, the picture is the lie detector</div>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 5000);
    const world = new THREE.Scene();
    world.background = new THREE.Color(0x07080c);

    let yaw = 0.45, pitch = 0.32, dist = 20;
    let dragging = false, lx = 0, ly = 0;
    canvas.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; });
    addEventListener('pointerup', () => dragging = false);
    addEventListener('pointermove', e => {
      if (!dragging || current === 'zoom') return;
      yaw -= (e.clientX - lx) * 0.005;
      pitch = Math.max(-1.3, Math.min(1.3, pitch + (e.clientY - ly) * 0.005));
      lx = e.clientX; ly = e.clientY;
    });
    canvas.addEventListener('wheel', e => {
      if (current === 'zoom') return;
      dist = Math.max(6, Math.min(60, dist + e.deltaY * 0.02));
    }, { passive: true });

    function resize() {
      renderer.setSize(innerWidth, innerHeight, false);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize); resize();

    const A = new THREE.Vector3(-6, 0, 0);
    const B = new THREE.Vector3(6, 0, 0);
    const Lmap = A.distanceTo(B);
    const cLight = 8; // units/s ; light-tick τ = Lmap/cLight
    const PHYS = { on: false, vOverC: 1, hissIsWord: false, noLocality: false, bothWays: false };
    function cNow() { return cLight; }
    function vNow() { if (current === 'break') return cLight * PHYS.vOverC; return cLight * (PHYS.on ? PHYS.vOverC : 1); }

    function discTex() {
      const c = document.createElement('canvas'); c.width = c.height = 64;
      const x = c.getContext('2d');
      const g = x.createRadialGradient(32, 32, 0, 32, 32, 30);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.45, 'rgba(255,255,255,.9)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = g; x.beginPath(); x.arc(32,32,30,0,6.28); x.fill();
      const t = new THREE.CanvasTexture(c);
      t.needsUpdate = true;
      return t;
    }
    const STAR_TEX = discTex();

    function fmtTime(s) {
      if (!isFinite(s)) return '∞';
      const a = Math.abs(s);
      if (a >= 1e4 || (a > 0 && a < 0.01)) return s.toExponential(2) + 's';
      return s.toFixed(2) + 's';
    }

    function makePhoton() {
      const g = new THREE.Group();
      g.add(new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 12), new THREE.MeshBasicMaterial({ color: 0xfff1a8 })));
      g.add(new THREE.Mesh(new THREE.SphereGeometry(0.5, 12, 8), new THREE.MeshBasicMaterial({ color: 0xfff1a8, transparent: true, opacity: 0.28 })));
      return g;
    }

    function makeLab(color) {
      const g = new THREE.Group();
      g.add(new THREE.Mesh(new THREE.SphereGeometry(0.28, 20, 14), new THREE.MeshBasicMaterial({ color })));
      const halo = new THREE.Mesh(new THREE.SphereGeometry(0.55, 14, 10), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.16 }));
      g.add(halo); g.userData.halo = halo;
      return g;
    }

    let layer = new THREE.Group();
    world.add(layer);
    let current = 'light';
    let state = {};
    const $title = document.getElementById('title');
    const $blurb = document.getElementById('blurb');
    const $math = document.getElementById('math');
    const $plain = document.getElementById('plain');
    const $status = document.getElementById('status');
    const $ctrls = document.getElementById('ctrls');
    const $pops = document.getElementById('pops');

    function plain(t) { $plain.textContent = t; }
    function popAt(worldVec, text, kind='', ms=3200) {
      const el = document.createElement('div');
      el.className = 'pop ' + kind;
      el.textContent = text;
      $pops.appendChild(el);
      const place = () => {
        const v = worldVec.clone().project(camera);
        el.style.left = ((v.x * 0.5 + 0.5) * innerWidth) + 'px';
        el.style.top = ((-v.y * 0.5 + 0.5) * innerHeight) + 'px';
      };
      place();
      el._place = place;
      setTimeout(() => { el.remove(); }, ms);
    }
    function clearPops() { $pops.innerHTML = ''; }

    function clearLayer() {
      world.remove(layer);
      layer.traverse(o => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) {
          if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
          else o.material.dispose();
        }
      });
      layer = new THREE.Group();
      world.add(layer);
      state = {};
      clearPops();
    }

    function html(s) { $ctrls.innerHTML = s; }

    // ---------- 1. LIGHT-TICK ----------
    function buildLight() {
      $title.textContent = 'Light-tick (retarded field)';
      $blurb.textContent = 'Maxwell / QED exhaust. Alice jiggles locally; Bob waits for the ripple. This is the legal photon. K = 1 by definition of the relational tick.';
      $math.textContent = 'Δt = L/c\nK = (L/c) / Δt = 1\nE = −∇Φ − ∂A/∂t   (retarded, not Coulomb-instant)';
      html(`<div class="row"><button class="primary" id="go">emit photon</button><button id="rst">reset</button></div>`);
      const a = makeLab(0xff6b4a); a.position.copy(A);
      const b = makeLab(0x4aa7ff); b.position.copy(B);
      layer.add(a, b);
      const cone = new THREE.Mesh(
        new THREE.SphereGeometry(1, 32, 16),
        new THREE.MeshBasicMaterial({ color: 0xfff1a8, transparent: true, opacity: 0.07, wireframe: true })
      );
      cone.visible = false; layer.add(cone);
      const ph = makePhoton();
      ph.visible = false; layer.add(ph);
      state = { a, b, cone, ph, flying: false, t0: 0 };
      document.getElementById('go').onclick = () => {
        state.flying = true; state.t0 = performance.now() / 1000;
        ph.visible = true; cone.visible = true; ph.position.copy(A);
        a.userData.halo.material.opacity = 0.6;
        $status.textContent = 'in flight…';
        popAt(A, 'Photon left. This is the exhaust, not a faster maker.', 'alice', 2800);
      };
      document.getElementById('rst').onclick = () => { state.flying = false; ph.visible = false; cone.visible = false; b.userData.halo.material.opacity = 0.16; $status.textContent = 'idle'; };
      plain('In English: Alice rings a bell. The sound (light) has to cross the room. Bob cannot hear it early. That wait is one light-tick. Everything else in this playground is trying to beat this race without cheating the clock.');
      $status.textContent = `L = ${Lmap.toFixed(1)}   τγ = ${(Lmap/cLight).toFixed(2)}s   K = 1`;
      popAt(A, 'Alice: local jiggle only', 'alice', 4000);
      popAt(B, 'Bob waits for the ripple', 'bob', 4000);
    }
    function tickLight(t) {
      if (!state.flying) return;
      const u = Math.min(1, (t - state.t0) / (Lmap / vNow()));
      state.ph.position.lerpVectors(A, B, u);
      const rCone = Math.min(Lmap * 1.4, (t - state.t0) * cNow());
      state.cone.scale.setScalar(Math.max(0.05, rCone));
      state.cone.position.copy(A);
      if (u >= 1) {
        state.flying = false; state.ph.visible = false;
        state.b.userData.halo.material.opacity = 0.7;
        const ftl = PHYS.on && PHYS.vOverC > 1.01;
        $status.textContent = ftl
          ? `arrived EARLY · v/c=${PHYS.vOverC.toFixed(2)} · outside the light shell · this is the break`
          : `arrived · Δt = τγ · K = 1 · Coulomb Φ looked instant; E did not`;
        popAt(B, ftl ? 'Broke it. Signal beat its own light shell. A moving observer can see this as backwards.' : 'Arrived on time. K=1. This is the honest baseline.', ftl ? 'oops' : 'bob', 3800);
      }
    }

    // ---------- 2. ZOOM / STARS ----------
    function starGeo(n, radius, island) {
      const pos = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        let x, y, z, r;
        if (island) {
          // ball of matter, empty outside
          do {
            x = (Math.random()*2-1)*radius; y = (Math.random()*2-1)*radius; z = (Math.random()*2-1)*radius;
            r = Math.hypot(x,y,z);
          } while (r > radius);
        } else {
          // homogeneous in a huge cube — equal matter everywhere we can fly
          const R = radius * 18;
          x = (Math.random()*2-1)*R; y = (Math.random()*2-1)*R; z = (Math.random()*2-1)*R;
        }
        pos[i*3]=x; pos[i*3+1]=y; pos[i*3+2]=z;
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      return g;
    }
    function buildZoom() {
      $title.textContent = 'Far-field point (zoom)';
      $blurb.textContent = 'Your picture: far enough and an object is a point. Two universes: an island of matter (zoom past the last star → black) vs equal matter everywhere (Olbers: the sky never empties). Angular size θ ≈ a/r → 0. That is compactification, not a faster photon.';
      $math.textContent = 'θ ≈ a / r  →  0 as r → ∞\nisland: ρ=0 for r > R  →  empty sky\nhomogeneous: ρ ≈ const  →  stars at every zoom\n(finite age: horizon c·t still cuts Olbers off)';
      html(`
        <div class="tog"><input type="checkbox" id="homo" /> <span>equal matter everywhere</span></div>
        <label><span>zoom distance</span><span id="zVal">28</span></label>
        <input id="zoomR" type="range" min="12" max="400" step="1" value="28" />
        <div class="rng"><span>in the cluster</span><span>past the last star</span></div>
        <p style="color:#8a8680;margin:8px 0 0">unchecked = island of stars, then nothing. checked = you never run out of matter.</p>
      `);
      const rebuild = () => {
        if (state.stars) { layer.remove(state.stars); state.stars.geometry.dispose(); }
        const homo = document.getElementById('homo').checked;
        const stars = new THREE.Points(
          starGeo(homo ? 16000 : 3500, 8, !homo),
          new THREE.PointsMaterial({
            color: 0xfff6d2, size: homo ? 0.08 : 0.11, sizeAttenuation: true,
            map: STAR_TEX, transparent: true, opacity: 0.95, depthWrite: false,
            blending: THREE.AdditiveBlending
          })
        );
        layer.add(stars); state.stars = stars;
        state.kind = homo ? 'homogeneous' : 'island';
        $status.textContent = homo
          ? 'homogeneous · every zoom still has stars · no special empty “beyond”'
          : 'island · pull zoom right until stars collapse to a speck, then black';
      };
      state = { stars: null, kind: 'island' };
      rebuild();
      document.getElementById('homo').onchange = rebuild;
      document.getElementById('zoomR').oninput = e => { document.getElementById('zVal').textContent = e.target.value; };
      dist = 28;
      document.getElementById('zoomR').value = 28;
      document.getElementById('zVal').textContent = '28';
    }
    function tickZoom() {
      const z = +document.getElementById('zoomR').value;
      dist = z;
      camera.near = Math.max(0.05, z / 500);
      camera.far = Math.max(2000, z * 20);
      camera.updateProjectionMatrix();
      const θ = (0.5 / z) * (180/Math.PI);
      const kind = state.kind || 'island';
      $status.textContent = kind + ` · r=${z} · typical θ ~ ${θ.toFixed(3)}°`;
    }

    // ---------- 3. GLUE / HARTMAN (race: around vs through) ----------
    function buildGlue() {
      $title.textContent = 'Through the wall vs around it';
      $blurb.textContent = 'A race. Yellow takes the long way (a real photon). Purple tries to leak through the wall (tunneling). Hartman is when the leaked bump looks early — that is a shape trick. A real message is a click. Thick wall: almost no clicks. Thin wall: the leak can beat the long way.';
      $math.textContent = 'T ≈ exp(−2κd)     leak probability\nτ_peak can look early     (Hartman trap)\nt_bit ≈ 1/T              wait for a real click\nK_honest = τγ / t_bit';
      plain('In English: whispering through a thick door. Sometimes the first little hiss seems instant (Hartman). That hiss is not a sentence. A sentence needs enough sound to count as a word (a click). Thin door: you hear the word before someone runs around the house. Thick door: you wait forever, and the runner wins.');
      html(`
        <label><span>wall thickness</span><span id="dVal">0.25</span></label>
        <input id="d" type="range" min="0.05" max="1" step="0.01" value="0.25" />
        <div class="rng"><span>thin door (word gets through)</span><span>thick door (only a hiss)</span></div>
        <div class="row"><button class="primary" id="ping">race: send both</button></div>
      `);
      const a = makeLab(0xff6b4a); a.position.copy(A);
      const b = makeLab(0x4aa7ff); b.position.copy(B);
      const wall = new THREE.Mesh(
        new THREE.BoxGeometry(0.5, 5.2, 5.2),
        new THREE.MeshBasicMaterial({ color: 0x9b7bff, transparent: true, opacity: 0.28 })
      );
      layer.add(a, b, wall);
      // long way around (arc in +y)
      const curve = new THREE.QuadraticBezierCurve3(A.clone(), new THREE.Vector3(0, 5.2, 0), B.clone());
      const longLine = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(curve.getPoints(40)),
        new THREE.LineDashedMaterial({ color: 0xfff1a8, dashSize: 0.25, gapSize: 0.12, transparent: true, opacity: 0.7 })
      );
      longLine.computeLineDistances();
      layer.add(longLine);
      const longPh = makePhoton(); longPh.visible = false; layer.add(longPh);
      const leakPh = makePhoton();
      leakPh.children[0].material.color.setHex(0xc9b0ff);
      leakPh.children[1].material.color.setHex(0xc9b0ff);
      leakPh.visible = false; layer.add(leakPh);
      const n = 500;
      const g = new THREE.BufferGeometry();
      const pos = new Float32Array(n*3);
      for (let i=0;i<n;i++){
        pos[i*3]=(Math.random()-0.5)*0.7;
        pos[i*3+1]=(Math.random()-0.5)*5;
        pos[i*3+2]=(Math.random()-0.5)*5;
      }
      g.setAttribute('position', new THREE.BufferAttribute(pos,3));
      const hiss = new THREE.Points(g, new THREE.PointsMaterial({
        color: 0xb9a4ff, size: 0.07, map: STAR_TEX, transparent: true, opacity: 0.45, depthWrite: false
      }));
      layer.add(hiss);
      state = { a, b, wall, curve, longPh, leakPh, hiss, racing: false, t0: 0, leakHit: false, leakDone: false, longDone: false, T: 0 };
      const upd = () => {
        const d = +document.getElementById('d').value;
        document.getElementById('dVal').textContent = d.toFixed(2);
        const κ = 3.2, T = Math.exp(-2*κ*d*4);
        wall.scale.set(0.35+d*3.2, 1, 1);
        hiss.material.opacity = Math.min(0.75, 0.08 + T*2);
        const tbit = 1/Math.max(T, 1e-9);
        const tγ = Lmap/cLight;
        const K = tγ/tbit;
        $status.textContent = `leak T≈${T.toExponential(2)}  wait-for-word ${fmtTime(tbit)}  long-way ${fmtTime(tγ)}  ${K>1 ? 'thin: word can win' : 'thick: runner wins'}`;
        state.T = T; state.tbit = tbit; state.d = d;
      };
      document.getElementById('d').oninput = upd; upd();
      popAt(new THREE.Vector3(0, 5.2, 0), 'Yellow = run around the house', 'warn', 4500);
      popAt(new THREE.Vector3(0, 0, 0), 'Purple = whisper through the door', '', 4500);
      document.getElementById('ping').onclick = () => {
        const T = state.T;
        state.racing = true; state.t0 = performance.now()/1000;
        state.longDone = state.leakDone = false;
        state.leakHit = PHYS.noLocality || PHYS.hissIsWord || Math.random() < Math.min(1, T * 4 + (T > 0.05 ? 0.35 : 0));
        state.longPh.visible = true;
        state.leakPh.visible = true;
        state.a.userData.halo.material.opacity = 0.7;
        state.b.userData.halo.material.color.setHex(0x4aa7ff);
        state.b.userData.halo.material.opacity = 0.16;
        popAt(A, 'Go. Yellow runs around. Purple tries the door.', 'alice', 2800);
        $status.textContent = PHYS.hissIsWord
          ? 'BREAK: hiss counts as a word · Hartman peak is being treated as a message (this is the lie)'
          : (state.leakHit
          ? 'race on · a real click may leak through'
          : 'race on · this time the door only hissed (no word). Watch yellow still finish.');
      };
    }
    function tickGlue(t) {
      if (!state.racing) return;
      const tγ = Lmap / vNow();
      const uLong = Math.min(1, (t - state.t0) / tγ);
      state.longPh.position.copy(state.curve.getPoint(uLong));
      // Hartman: leaked *shape* crosses quickly (short delay), even when no click
      const tPeak = 0.12 + state.d * 0.08; // looks early, barely grows with d
      const uPeak = Math.min(1, (t - state.t0) / tPeak);
      state.leakPh.position.lerpVectors(A, B, uPeak);
      state.leakPh.visible = uPeak < 1 || !state.leakDone;
      state.leakPh.children[1].material.opacity = 0.12 + 0.25 * state.T; // faint if starved
      if (!state.leakDone && uPeak >= 1) {
        state.leakDone = true;
        popAt(B, state.leakHit
          ? 'CLICK. That is a word through the door. Honest shortcut if it beat yellow.'
          : 'Hiss only (Hartman). The bump arrived looking early, but it was not a message.',
          state.leakHit ? 'bob' : 'warn', 4200);
        if (state.leakHit) {
          state.b.userData.halo.material.color.setHex(0x4aa7ff);
          state.b.userData.halo.material.opacity = 0.8;
        } else {
          state.b.userData.halo.material.color.setHex(0x886633);
          state.b.userData.halo.material.opacity = 0.35;
        }
      }
      if (!state.longDone && uLong >= 1) {
        state.longDone = true;
        state.racing = false;
        state.longPh.visible = false;
        popAt(new THREE.Vector3(0, 5.2, 0), state.leakHit
          ? 'Yellow finished too. Compare: who lit Bob first?'
          : 'Runner wins. Thick door: you wait for a word that almost never comes.',
          'warn', 4000);
      }
    }

    // ---------- 4. SHARED MODE ----------
    function buildMode() {
      $title.textContent = 'Shared-mode coupler (no ∇)';
      $blurb.textContent = 'The live stretch. One oscillator both labs already hold. No spatial gradient on χ — delay is how sluggish the oscillator is, not L/c. Photon is exhaust; this is the pond’s private bookkeeping. One-way write so boosted frames don’t get time loops.';
      $math.textContent = 'χ̈ + Ω² χ = g_A φ_A     (no ∇χ)\nτ ≈ γ/Ω²   (group delay of the lumped mode)\nK = (L/c) / τ   ∝ L Ω²\nwrite-asymmetric: Alice sources, Bob reads';
      html(`
        <label><span>Ω stiffness</span><span id="oVal">8</span></label>
        <input id="om" type="range" min="1" max="24" step="0.5" value="8" />
        <div class="rng"><span>soft (slow)</span><span>stiff (fast K)</span></div>
        <div class="tog"><input type="checkbox" id="oneway" checked /> <span>one-way (Alice→Bob)</span></div>
        <div class="row"><button class="primary" id="kick">Alice kick χ</button></div>
      `);
      const a = makeLab(0xff6b4a); a.position.copy(A);
      const b = makeLab(0x4aa7ff); b.position.copy(B);
      const rod = new THREE.Mesh(
        new THREE.CylinderGeometry(0.12, 0.12, Lmap, 16, 1, true),
        new THREE.MeshBasicMaterial({ color: 0x5dffc8, transparent: true, opacity: 0.7 })
      );
      rod.rotation.z = Math.PI/2; layer.add(a,b,rod);
      state = { a, b, rod, chi: 0, v: 0, pulse: 0 };
      const upd = () => {
        const Ω = +document.getElementById('om').value;
        document.getElementById('oVal').textContent = Ω;
        const tau = 1/(Ω*Ω) * 8;
        const K = (Lmap/cLight)/tau;
        $status.textContent = `Ω=${Ω}  τ≈${tau.toFixed(3)}s  τγ=${(Lmap/cLight).toFixed(2)}s  K≈${K.toFixed(1)}`;
        state.Ω = Ω; state.tau = tau; state.K = K;
      };
      document.getElementById('om').oninput = upd; upd();
      document.getElementById('kick').onclick = () => {
        state.v += 6; state.pulse = 1; state.a.userData.halo.material.opacity = 0.7;
        const oneway = document.getElementById('oneway').checked && !PHYS.bothWays;
        $status.textContent = oneway
          ? `kick · Bob will follow χ in ~${state.tau.toFixed(3)}s · K≈${state.K.toFixed(1)}`
          : `kick both ways · Tolman-dangerous if a boost aims the return`;
        popAt(A, 'Pluck the shared string.', 'alice', 2200);
        popAt(B, oneway ? 'Bob feels the same string.' : 'Both ways: time-loop risk if someone is moving.', 'bob', 2800);
      };
    }
    function tickMode(dt) {
      if (state.Ω == null) return;
      // χ̈ + Ω² χ = 0 after kicks injected into v
      state.v += (-state.Ω*state.Ω * state.chi) * dt;
      state.chi += state.v * dt;
      state.v *= 0.995;
      state.pulse = Math.max(0, (state.pulse || 0) - dt * 0.55);
      const amp = Math.min(1, Math.abs(state.chi)*0.5 + state.pulse);
      state.rod.material.opacity = 0.45 + amp * 0.55;
      state.rod.material.color.setHSL(0.45, 0.9, 0.55 + 0.2*amp);
      state.b.userData.halo.material.opacity = 0.16 + amp * 0.75;
      state.rod.scale.set(1 + amp*1.8, 1, 1 + amp*1.8);
    }

    // ---------- 5. MIRAGE ----------
    function buildMirage() {
      $title.textContent = 'Coarse-clock mirage';
      $blurb.textContent = 'If your dial is blunter than the true delay, Bob looks updated “before” Alice’s tick. Fine the clock and the ghost dies. A real fold does not. f_illusion = 1 − δ/P  (when δ < P).';
      $math.textContent = 'δ = true delay   P = tick period\nf = max(0, 1 − δ/P)\nmirage if K_true ≤ 1 but f > 0\navenue if K_true > 1 as P → 0';
      html(`
        <label><span>true delay δ (ticks of light)</span><span id="dv">0.4</span></label>
        <input id="del" type="range" min="0.05" max="1.5" step="0.05" value="0.4" />
        <div class="rng"><span>fast (fold-like)</span><span>slow</span></div>
        <label><span>clock period P</span><span id="pv">1.0</span></label>
        <input id="per" type="range" min="0.1" max="2" step="0.05" value="1.0" />
        <div class="rng"><span>fine clock</span><span>blunt clock</span></div>
        <div class="row"><button class="primary" id="go">send</button></div>
      `);
      const a = makeLab(0xff6b4a); a.position.copy(A);
      const b = makeLab(0x4aa7ff); b.position.copy(B);
      layer.add(a,b);
      // clock rings
      const ringA = new THREE.Mesh(new THREE.RingGeometry(0.7, 0.85, 32), new THREE.MeshBasicMaterial({ color: 0xff6b4a, side: THREE.DoubleSide }));
      const ringB = new THREE.Mesh(new THREE.RingGeometry(0.7, 0.85, 32), new THREE.MeshBasicMaterial({ color: 0x4aa7ff, side: THREE.DoubleSide }));
      ringA.position.copy(A); ringB.position.copy(B);
      layer.add(ringA, ringB);
      const ph = makePhoton();
      ph.visible = false; layer.add(ph);
      const ghost = makeLab(0xffe08a);
      ghost.position.copy(B);
      ghost.userData.halo.material.opacity = 0;
      ghost.children[0].material.transparent = true;
      ghost.children[0].material.opacity = 0;
      layer.add(ghost);
      state = { a, b, ringA, ringB, ph, ghost, flying: false, t0: 0, ghosted: false };
      const upd = () => {
        const δ = +document.getElementById('del').value;
        const P = +document.getElementById('per').value;
        document.getElementById('dv').textContent = δ.toFixed(2);
        document.getElementById('pv').textContent = P.toFixed(2);
        const f = Math.max(0, 1 - δ/P);
        const Ktrue = 1/δ;
        const kind = (Ktrue>1.01 && f>0) ? 'avenue+mirage overlay' : (Ktrue>1.01) ? 'true avenue' : (f>0) ? 'MIRAGE only' : 'clean subluminal';
        $status.textContent = `δ=${δ}  P=${P}  f_illusion=${f.toFixed(2)}  K_true=${Ktrue.toFixed(2)}  → ${kind}`;
        state.δ = δ; state.P = P; state.f = f;
      };
      document.getElementById('del').oninput = upd;
      document.getElementById('per').oninput = upd; upd();
      document.getElementById('go').onclick = () => {
        state.flying = true; state.t0 = performance.now()/1000;
        state.ph.visible = true; state.ph.position.copy(A);
        state.a.userData.halo.material.opacity = 0.6;
        state.ghosted = false;
        state.ghost.userData.halo.material.opacity = 0;
        state.ghost.children[0].material.opacity = 0;
      };
    }
    function tickMirage(t) {
      if (!state.flying) return;
      const τ = Lmap/vNow();
      const u = Math.min(1, (t - state.t0) / (τ * state.δ));
      state.ph.position.lerpVectors(A, B, u);
      const tickA = Math.floor((t - state.t0) / (τ * state.P));
      const tickB = Math.floor((t - state.t0) / (τ * state.P));
      state.ringA.rotation.z = (t / (τ * state.P)) * Math.PI * 2;
      state.ringB.rotation.z = state.ringA.rotation.z;
      // ghost: coarse clock already paints Bob if δ < P (same tick)
      if (!state.ghosted && state.δ < state.P && u > 0.05 && u < 1) {
        state.ghosted = true;
        state.ghost.userData.halo.material.opacity = 0.55;
        state.ghost.children[0].material.opacity = 0.35;
        popAt(B, 'Ghost: the blunt clock already painted Bob. The real photon is still in the air.', 'warn', 3200);
      }
      if (u >= 1) {
        state.flying = false; state.ph.visible = false;
        state.b.userData.halo.material.opacity = 0.7;
        const sameTick = state.δ < state.P;
        $status.textContent += sameTick ? ' · Bob lit inside Alice’s same coarse tick (looks spooky)' : ' · Bob lit on a later tick (honest)';
      }
    }

    function fabricGrid(kind, k) {
      const g = new THREE.Group();
      const mat = new THREE.LineBasicMaterial({ color: 0x3a4258, transparent: true, opacity: 0.55 });
      const xs = [];
      for (let i = -10; i <= 10; i++) {
        let t = i / 10;
        if (kind === 'warp') t = Math.sign(t) * Math.pow(Math.abs(t), 1 / k);
        xs.push(t * 8);
      }
      for (const x of xs) {
        const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x,-4,-4), new THREE.Vector3(x,4,-4)]);
        g.add(new THREE.Line(geo, mat));
      }
      for (let z = -4; z <= 4; z += 1) {
        const pts = xs.map(x => new THREE.Vector3(x, -4, z));
        g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
        const pts2 = xs.map(x => new THREE.Vector3(x, 0.02, z));
        g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts2), new THREE.LineBasicMaterial({ color: 0x2e3548, transparent: true, opacity: 0.35 })));
      }
      return g;
    }
    function mouth(pos) {
      const m = new THREE.Mesh(
        new THREE.TorusGeometry(0.55, 0.08, 10, 28),
        new THREE.MeshBasicMaterial({ color: 0xc9a0ff })
      );
      m.rotation.y = Math.PI/2;
      m.position.copy(pos);
      return m;
    }
    function buildBreak() {
      $title.textContent = 'Break physics / reshape space';
      $blurb.textContent = 'Yellow shell = light on the FLAT map. Magenta = your signal. You can outrun the shell by going faster than light (illegal) OR by changing the map (the real game). Freeze at the finish.';
      $math.textContent = 'flat: Δt = L/v          shell r = c t\nwarp: L_proper = L/k     same car, shorter meter stick\nfold: Δt = ℓ/v           hidden adjacency, ℓ ≪ L\nwrap: Δt = min(L, C−L)/v torus; the other way around';
      plain('In English: two cheats. (1) Make the car faster than light — funny, illegal, a moving stranger can see the future first. (2) Fold, squeeze, or wrap the road so a normal-speed car arrives while the old map’s light bubble is still short. That’s not a faster car. That’s a lying map.');
      html(`
        <label>shape of space</label>
        <select id="geom" style="margin-bottom:8px">
          <option value="flat">flat Minkowski (default)</option>
          <option value="warp">squeezed (warp the meter)</option>
          <option value="fold">folded (hidden door)</option>
          <option value="wrap">wrapped (torus / the other way)</option>
        </select>
        <label><span>how hard</span><span id="kVal">2.0</span></label>
        <input id="kAmt" type="range" min="1" max="5" step="0.1" value="2" />
        <div class="rng"><span>mild</span><span>aggressive</span></div>
        <label><span>v / c</span><span id="brkVc">1.00</span></label>
        <input id="brkV" type="range" min="0.3" max="3" step="0.05" value="1" />
        <div class="rng"><span>slow</span><span>light</span><span>illegal fast</span></div>
        <div class="row"><button class="primary" id="go">send and freeze</button></div>
      `);
      PHYS.on = true;
      PHYS.vOverC = 1;
      const bo = document.getElementById('breakOn');
      const vc = document.getElementById('vc');
      if (bo) { bo.checked = true; document.getElementById('breakBody').classList.remove('hidden'); }
      if (vc) { vc.value = 1; document.getElementById('vcVal').textContent = '1.00'; }
      dist = 28;

      const a = makeLab(0xff6b4a); a.position.copy(A);
      const b = makeLab(0x4aa7ff); b.position.copy(B);
      const cone = new THREE.Mesh(
        new THREE.SphereGeometry(1, 36, 22),
        new THREE.MeshBasicMaterial({ color: 0xffe566, transparent: true, opacity: 0.22, wireframe: true })
      );
      cone.position.copy(A);
      const disk = new THREE.Mesh(
        new THREE.CircleGeometry(1, 48),
        new THREE.MeshBasicMaterial({ color: 0xffe566, transparent: true, opacity: 0.08, side: THREE.DoubleSide })
      );
      disk.rotation.x = Math.PI/2; disk.position.copy(A);
      const ph = makePhoton();
      ph.children[0].material.color.setHex(0xff66aa);
      ph.children[1].material.color.setHex(0xff66aa);
      ph.visible = false;
      const mark = new THREE.Mesh(
        new THREE.TorusGeometry(0.35, 0.04, 8, 24),
        new THREE.MeshBasicMaterial({ color: 0xffe566 })
      );
      mark.visible = false;
      const mA = mouth(new THREE.Vector3(A.x + 1.1, 0, 0));
      const mB = mouth(new THREE.Vector3(B.x - 1.1, 0, 0));
      mA.visible = mB.visible = false;
      const grid = fabricGrid('flat', 1);
      layer.add(grid, a, b, cone, disk, ph, mark, mA, mB);
      const path = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([A, B]),
        new THREE.LineDashedMaterial({ color: 0xff66aa, dashSize: 0.2, gapSize: 0.12, transparent: true, opacity: 0.4 })
      );
      path.computeLineDistances();
      layer.add(path);
      state = { a, b, cone, disk, ph, mark, mA, mB, grid, path, flying: false, frozen: false, t0: 0, geom: 'flat', k: 2 };

      const applyGeom = () => {
        const geom = document.getElementById('geom').value;
        const k = +document.getElementById('kAmt').value;
        document.getElementById('kVal').textContent = k.toFixed(1);
        state.geom = geom; state.k = k;
        layer.remove(state.grid);
        state.grid = fabricGrid(geom === 'warp' ? 'warp' : 'flat', k);
        layer.add(state.grid);
        state.mA.visible = state.mB.visible = (geom === 'fold');
        world.background.setHex(geom === 'flat' && PHYS.vOverC <= 1.01 ? 0x07080c : 0x101018);
        const names = { flat: 'flat map', warp: 'squeezed meters', fold: 'hidden door', wrap: 'torus wrap' };
        $status.textContent = names[geom] + ' · v/c=' + PHYS.vOverC.toFixed(2);
      };
      const setV = () => {
        const v = +document.getElementById('brkV').value;
        document.getElementById('brkVc').textContent = v.toFixed(2);
        PHYS.vOverC = v; PHYS.on = true;
        if (vc) { vc.value = v; document.getElementById('vcVal').textContent = v.toFixed(2); }
        applyGeom();
      };
      document.getElementById('geom').onchange = applyGeom;
      document.getElementById('kAmt').oninput = applyGeom;
      document.getElementById('brkV').oninput = setV;
      applyGeom();
      document.getElementById('go').onclick = () => {
        state.flying = true; state.frozen = false; state.t0 = performance.now()/1000;
        ph.visible = true; mark.visible = false; ph.position.copy(A);
        a.userData.halo.material.opacity = 0.7;
        b.userData.halo.material.opacity = 0.16;
        popAt(A, 'Sent on this geometry.', 'alice', 2200);
      };
      popAt(A, 'Try Fold at v/c=1. That’s the honest weird.', 'alice', 4200);
    }
    function signalPos(u, geom, k) {
      if (geom === 'fold') {
        const a2 = new THREE.Vector3(A.x + 1.1, 0, 0);
        const b2 = new THREE.Vector3(B.x - 1.1, 0, 0);
        if (u < 0.45) return A.clone().lerp(a2, u / 0.45);
        if (u < 0.55) return a2.clone().lerp(b2, (u - 0.45) / 0.1);
        return b2.clone().lerp(B, (u - 0.55) / 0.45);
      }
      if (geom === 'wrap') {
        const W = 7.5;
        const short = 2 * W - Lmap; // around the back
        const dist = short * u;
        let x = A.x - dist;
        const min = -W, span = 2 * W;
        while (x < min) x += span;
        return new THREE.Vector3(x, 0, 0);
      }
      return A.clone().lerp(B, u);
    }
    function tripTime(geom, k, v) {
      if (geom === 'warp') return (Lmap / k) / v;
      if (geom === 'fold') return (2.2 + (Lmap * 0.08) / k) / v;
      if (geom === 'wrap') return (2 * 7.5 - Lmap) / v;
      return Lmap / v;
    }
    function tickBreak(t) {
      if (!state.flying && !state.frozen) return;
      if (state.frozen) return;
      const v = vNow();
      const geom = state.geom, k = state.k;
      const Ttrip = tripTime(geom, k, v);
      const u = Math.min(1, (t - state.t0) / Ttrip);
      state.ph.position.copy(signalPos(u, geom, k));
      const r = Math.max(0.05, (t - state.t0) * cNow());
      state.cone.scale.setScalar(r);
      state.disk.scale.setScalar(r);
      state.mark.visible = true;
      state.mark.position.set(A.x + Math.min(r, 16), 0, 0);
      if (u >= 1) {
        state.flying = false;
        state.frozen = true;
        state.ph.position.copy(geom === 'wrap' ? B : signalPos(1, geom, k));
        if (geom === 'wrap') state.ph.position.copy(B);
        const rFinal = Ttrip * cNow();
        state.cone.scale.setScalar(Math.max(0.05, rFinal));
        state.disk.scale.setScalar(Math.max(0.05, rFinal));
        state.mark.position.set(A.x + Math.min(rFinal, 16), 0, 0);
        state.b.userData.halo.material.opacity = 0.8;
        const beatMap = rFinal + 0.35 < Lmap;
        const illegal = PHYS.vOverC > 1.01;
        if (illegal && geom === 'flat') {
          $status.textContent = 'FROZEN · faster than light on a flat map · funny, illegal, loop bait';
          popAt(B, 'Illegal fast. Boring-legal is safer. This tears order.', 'oops', 5500);
        } else if (geom === 'fold' && beatMap) {
          $status.textContent = 'FROZEN · folded door · legal-speed car, lying map · this is the research';
          popAt(B, 'Same speed of light. Shorter road. This is the one that isn’t a joke.', 'bob', 6000);
          popAt(state.mark.position.clone(), 'Flat-map light is still back here.', 'warn', 6000);
        } else if (geom === 'warp' && beatMap) {
          $status.textContent = 'FROZEN · squeezed meters · light also takes the short stick · map is the liar';
          popAt(B, 'You didn’t beat light. You shrank the ruler. They still tied locally.', 'bob', 6000);
        } else if (geom === 'wrap' && beatMap) {
          $status.textContent = 'FROZEN · went the other way around the torus';
          popAt(B, 'Still light-speed. The universe was a doughnut. The long hallway was a sucker bet.', 'bob', 6000);
        } else if (PHYS.vOverC < 0.99) {
          $status.textContent = 'FROZEN · slower than light · boring, legal, late';
          popAt(B, 'Light got here first. Boring, legal, slow.', 'bob', 4000);
        } else {
          $status.textContent = 'FROZEN · photo finish with the flat-map shell';
          popAt(B, 'Tied with light on this geometry.', 'bob', 4000);
        }
      }
    }

    const builders = { light: buildLight, zoom: buildZoom, glue: buildGlue, mode: buildMode, mirage: buildMirage, break: buildBreak };
    const tickers = { light: tickLight, zoom: tickZoom, glue: tickGlue, mode: tickMode, mirage: tickMirage };

    function load(name) {
      current = name;
      yaw = 0.45; pitch = 0.32; dist = 20;
      camera.near = 0.05; camera.far = 5000; camera.updateProjectionMatrix();
      clearLayer();
      builders[name]();
    }
    function syncBreak() {
      PHYS.on = document.getElementById('breakOn').checked;
      document.getElementById('breakBody').classList.toggle('hidden', !PHYS.on);
      PHYS.vOverC = +document.getElementById('vc').value;
      document.getElementById('vcVal').textContent = PHYS.vOverC.toFixed(2);
      PHYS.hissIsWord = document.getElementById('hissBit').checked;
      PHYS.noLocality = document.getElementById('noLoc').checked;
      PHYS.bothWays = document.getElementById('bothWay').checked;
      if (PHYS.on && PHYS.vOverC > 1.01) {
        world.background.setHex(0x140808);
      } else {
        world.background.setHex(0x07080c);
      }
    }
    document.getElementById('breakOn').onchange = syncBreak;
    document.getElementById('vc').oninput = syncBreak;
    document.getElementById('hissBit').onchange = syncBreak;
    document.getElementById('noLoc').onchange = syncBreak;
    document.getElementById('bothWay').onchange = syncBreak;
    syncBreak();

    document.getElementById('sceneSel').onchange = e => load(e.target.value);
    load('light');

    let last = performance.now()/1000;
    function frame() {
      const t = performance.now()/1000;
      const dt = Math.min(0.05, t - last); last = t;
      if (current === 'zoom') {
        camera.position.set(0, 0, dist);
        camera.lookAt(0,0,0);
      } else {
        camera.position.set(
          dist * Math.sin(yaw) * Math.cos(pitch),
          dist * Math.sin(pitch),
          dist * Math.cos(yaw) * Math.cos(pitch)
        );
        camera.lookAt(0,0,0);
      }
      if (current === 'mode') tickMode(dt);
      else if (current === 'light') tickLight(t);
      else if (current === 'zoom') tickZoom();
      else if (current === 'mirage') tickMirage(t);
      else if (current === 'glue') tickGlue(t);
      else if (current === 'break') tickBreak(t);
      // keep bubbles stuck to world points
      for (const el of $pops.children) { if (el._place) el._place(); }
      renderer.render(world, camera);
      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>
