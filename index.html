<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fabric pond — fuck with physics</title>
  <style>
    html, body { margin: 0; height: 100%; background: #07080c; color: #e8e6df; font-family: ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
    #c { display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute; left: 16px; top: 16px; max-width: 420px;
      background: rgba(8,10,16,.72); border: 1px solid #2a3144; border-radius: 12px;
      padding: 12px 14px; font-size: 13px; line-height: 1.4; backdrop-filter: blur(8px);
    }
    #hud h1 { font-size: 14px; margin: 0 0 6px; font-weight: 600; letter-spacing: .02em; }
    #hud p { margin: 0 0 8px; color: #b7b3a8; }
    #status { color: #9fd6ff; font-variant-numeric: tabular-nums; }
    #panel {
      position: absolute; right: 16px; top: 16px; width: 280px;
      background: rgba(8,10,16,.8); border: 1px solid #2a3144; border-radius: 12px;
      padding: 12px; font-size: 12px; backdrop-filter: blur(8px);
    }
    label { display: flex; justify-content: space-between; gap: 8px; margin: 8px 0 2px; color: #c9c4b8; }
    input[type=range] { width: 100%; }
    .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    button {
      background: #1b2233; color: #e8e6df; border: 1px solid #3a4560; border-radius: 8px;
      padding: 7px 10px; cursor: pointer; font-size: 12px;
    }
    button:hover { background: #243049; }
    button.primary { background: #2a4a6e; border-color: #5aa0d6; }
    button.warn { background: #4a2a22; border-color: #c46a4a; }
    .tog { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: #c9c4b8; }
    #hint { position: absolute; bottom: 12px; left: 16px; font-size: 11px; color: #7d7a72; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <h1>The pond</h1>
    <p>Field is already everywhere. Photons are exhaust. Glue is a thin extra-axis leak. Remote address is the missing API.</p>
    <div id="status">idle</div>
  </div>
  <div id="panel">
    <label><span>glue thickness</span><span id="gVal">0.35</span></label>
    <input id="glue" type="range" min="0" max="1" step="0.01" value="0.35" />
    <label><span>glue (thin sweet spot is left-ish)</span></label>
    <div class="tog"><input id="api" type="checkbox" /> <span>remote address (cheat)</span></div>
    <div class="tog"><input id="endcap" type="checkbox" /> <span>end-cap camera</span></div>
    <div class="row">
      <button class="primary" id="photon">send photon</button>
      <button id="tickle">tickle shared mode</button>
    </div>
    <div class="row">
      <button id="force">force P(Bob)</button>
      <button class="warn" id="reset">reset</button>
    </div>
  </div>
  <div id="hint">drag to orbit · the cheat switch is “Alice can address Bob’s patch”</div>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('c');
    const status = document.getElementById('status');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x07080c, 0.045);
    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
    camera.position.set(0, 8, 18);

    const alicePos = new THREE.Vector3(-6, 0, 0);
    const bobPos = new THREE.Vector3(6, 0, 0);
    const L = alicePos.distanceTo(bobPos); // map jog
    const c = 6; // world units per second = 1 light-tick across L takes L/c

    function lab(color, pos, name) {
      const g = new THREE.Group();
      const core = new THREE.Mesh(
        new THREE.SphereGeometry(0.28, 24, 16),
        new THREE.MeshBasicMaterial({ color })
      );
      const halo = new THREE.Mesh(
        new THREE.SphereGeometry(0.55, 16, 12),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.18 })
      );
      g.add(core, halo);
      g.position.copy(pos);
      g.userData.halo = halo;
      scene.add(g);
      return g;
    }
    const alice = lab(0xff6b4a, alicePos, 'A');
    const bob = lab(0x4aa7ff, bobPos, 'B');

    // pond particles
    const N = 1800;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(N * 3);
    const pCol = new Float32Array(N * 3);
    const pBase = [];
    for (let i = 0; i < N; i++) {
      const x = (Math.random() - 0.5) * 22;
      const y = (Math.random() - 0.5) * 10;
      const z = (Math.random() - 0.5) * 10;
      pPos[i*3] = x; pPos[i*3+1] = y; pPos[i*3+2] = z;
      pCol[i*3] = pCol[i*3+1] = pCol[i*3+2] = 0.18;
      pBase.push(new THREE.Vector3(x, y, z));
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
    const pond = new THREE.Points(pGeo, new THREE.PointsMaterial({
      size: 0.06, vertexColors: true, transparent: true, opacity: 0.9
    }));
    scene.add(pond);

    // glue axis (the extra-w wall between faces)
    const glueCurve = new THREE.LineCurve3(alicePos, bobPos);
    const glueMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(0.06, 0.06, L, 12, 1, true),
      new THREE.MeshBasicMaterial({ color: 0x9b7bff, transparent: true, opacity: 0.35 })
    );
    glueMesh.rotation.z = Math.PI / 2;
    scene.add(glueMesh);
    const faces = [];
    [alicePos, bobPos].forEach((p, i) => {
      const f = new THREE.Mesh(
        new THREE.CircleGeometry(0.85, 32),
        new THREE.MeshBasicMaterial({ color: 0x9b7bff, transparent: true, opacity: 0.15, side: THREE.DoubleSide })
      );
      f.position.copy(p);
      f.lookAt(i ? alicePos : bobPos);
      scene.add(f);
      faces.push(f);
    });

    let photon = null;
    let mode = 'idle';
    let t0 = 0;
    let bobGlow = 0;
    let aliceGlow = 0;
    let clicks = 0;
    let starved = false;

    const glueSlider = document.getElementById('glue');
    const gVal = document.getElementById('gVal');
    const api = document.getElementById('api');
    const endcap = document.getElementById('endcap');

    function glueParams() {
      // 0 = no glue, ~0.3 thin sweet, 1 = thick starved Hartman wall
      const g = +glueSlider.value;
      const T = Math.exp(-6 * g * g); // leak probability analog
      const delay = 0.05 + 0.15 * g; // oscillator / thin-path delay (seconds)
      return { g, T, delay, thin: g > 0.02 && g < 0.45 };
    }

    function setStatus(s) { status.textContent = s; }

    function spawnPhoton() {
      if (photon) scene.remove(photon);
      photon = new THREE.Mesh(
        new THREE.SphereGeometry(0.12, 12, 10),
        new THREE.MeshBasicMaterial({ color: 0xfff1a8 })
      );
      photon.position.copy(alicePos);
      scene.add(photon);
      mode = 'photon';
      t0 = performance.now() / 1000;
      aliceGlow = 1;
      setStatus('photon in flight · exhaust on the map · wait one light-tick');
    }

    function tickle() {
      const { g, T, delay, thin } = glueParams();
      aliceGlow = 1;
      const cheat = api.checked;
      if (!cheat && g < 0.02) {
        mode = 'denied';
        t0 = performance.now() / 1000;
        setStatus('no remote address · local API only · Bob’s fabric is there but you can’t grab it');
        return;
      }
      if (!cheat && g >= 0.45) {
        mode = 'starved';
        t0 = performance.now() / 1000;
        starved = Math.random() > T * 8;
        setStatus(starved
          ? 'thick glue · Hartman fireworks, almost no click (starved T)'
          : 'thick glue · lucky leak click');
        if (!starved) {
          setTimeout(() => { bobGlow = 1; clicks++; }, delay * 1000);
        }
        return;
      }
      // thin glue or cheat: shared-mode tickle
      mode = 'tickle';
      t0 = performance.now() / 1000;
      const wait = cheat ? 0.02 : delay;
      setStatus(cheat
        ? 'CHEAT on · Alice addressed Bob’s patch · pond jiggled in place'
        : `thin end-cap glue · T≈${T.toFixed(2)} · tickle delay ${wait.toFixed(2)}s (not L/c)`);
      setTimeout(() => { bobGlow = 1; clicks++; }, wait * 1000);
    }

    function forceP() {
      const { T, g } = glueParams();
      aliceGlow = 1;
      // squeeze wall: contrast, still probabilistic
      const p = Math.min(0.95, T * 1.8);
      const hit = Math.random() < p;
      mode = 'force';
      t0 = performance.now() / 1000;
      if (hit) {
        bobGlow = 1; clicks++;
        setStatus(`forced P(Bob) · loaded die rolled yes · p≈${p.toFixed(2)}`);
      } else {
        setStatus(`forced P(Bob) · still no · p≈${p.toFixed(2)} · fabric unmoved`);
      }
    }

    document.getElementById('photon').onclick = spawnPhoton;
    document.getElementById('tickle').onclick = tickle;
    document.getElementById('force').onclick = forceP;
    document.getElementById('reset').onclick = () => {
      if (photon) { scene.remove(photon); photon = null; }
      bobGlow = aliceGlow = 0; mode = 'idle'; clicks = 0;
      setStatus('idle');
    };
    glueSlider.oninput = () => { gVal.textContent = (+glueSlider.value).toFixed(2); };

    // orbit
    let dragging = false, lx=0, ly=0, yaw=0.4, pitch=0.35, dist=20;
    canvas.addEventListener('pointerdown', e => { dragging = true; lx=e.clientX; ly=e.clientY; });
    window.addEventListener('pointerup', () => dragging = false);
    window.addEventListener('pointermove', e => {
      if (!dragging) return;
      yaw -= (e.clientX - lx) * 0.005;
      pitch = Math.max(-1.2, Math.min(1.2, pitch + (e.clientY - ly) * 0.005));
      lx = e.clientX; ly = e.clientY;
    });
    canvas.addEventListener('wheel', e => { dist = Math.max(8, Math.min(40, dist + e.deltaY * 0.02)); }, { passive: true });

    const tmp = new THREE.Vector3();
    const cols = pond.geometry.attributes.color;

    function resize() {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h; camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize); resize();

    function paintPond(now) {
      const { g, T } = glueParams();
      glueMesh.material.opacity = 0.1 + 0.5 * Math.max(0.05, 1 - g);
      glueMesh.scale.set(1 + g * 4, 1, 1 + g * 4);
      const photonPos = photon ? photon.position : null;
      for (let i = 0; i < N; i++) {
        const x = pBase[i];
        // distance to glue axis (x-axis between A and B)
        const t = THREE.MathUtils.clamp((x.x - alicePos.x) / (bobPos.x - alicePos.x), 0, 1);
        const axis = tmp.copy(alicePos).lerp(bobPos, t);
        const rho = x.distanceTo(axis);
        const evan = Math.exp(-rho * (1.2 + 8 * g)) * (g > 0.01 ? 1 : 0);
        let r = 0.12, gn = 0.14, b = 0.22;
        r += evan * 0.45; gn += evan * 0.2; b += evan * 0.7;
        if (photonPos) {
          const d = x.distanceTo(photonPos);
          const flash = Math.exp(-d * d * 3.5);
          r += flash * 0.9; gn += flash * 0.8; b += flash * 0.3;
        }
        const dA = x.distanceTo(alicePos);
        const dB = x.distanceTo(bobPos);
        r += aliceGlow * Math.exp(-dA * 2.2) * 0.8;
        b += bobGlow * Math.exp(-dB * 2.2) * 0.9;
        gn += bobGlow * Math.exp(-dB * 2.2) * 0.15;
        cols.setXYZ(i, r, gn, b);
      }
      cols.needsUpdate = true;
      alice.userData.halo.material.opacity = 0.15 + 0.5 * aliceGlow;
      bob.userData.halo.material.opacity = 0.15 + 0.5 * bobGlow;
    }

    function cam(dt) {
      if (endcap.checked) {
        // look down the glue, Bob's face is the speck
        camera.position.lerp(new THREE.Vector3(bobPos.x + 0.2, 0, 0.01), 0.08);
        camera.lookAt(alicePos.x, 0, 0);
      } else {
        const cx = dist * Math.sin(yaw) * Math.cos(pitch);
        const cy = dist * Math.sin(pitch);
        const cz = dist * Math.cos(yaw) * Math.cos(pitch);
        camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.12);
        camera.lookAt(0, 0, 0);
      }
    }

    let last = performance.now() / 1000;
    function frame() {
      const now = performance.now() / 1000;
      const dt = now - last; last = now;
      if (mode === 'photon' && photon) {
        const u = Math.min(1, (now - t0) / (L / c));
        photon.position.lerpVectors(alicePos, bobPos, u);
        if (u >= 1) {
          bobGlow = 1; clicks++;
          scene.remove(photon); photon = null; mode = 'arrived';
          setStatus(`photon arrived · ${(L/c).toFixed(2)}s light-tick · clicks=${clicks}`);
        }
      }
      aliceGlow *= 0.985;
      bobGlow *= 0.985;
      paintPond(now);
      cam(dt);
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    frame();
    setStatus('idle · try photon, then tickle, then slide glue, then flip the cheat');
  </script>
</body>
</html>
